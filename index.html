<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Google Analytics -->
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6WZN7LJ9HQ');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>A Power Within: Ukrainian POWs Remember</title>

  <meta
    name="description"
    content="A Power Within: Ukrainian POWs Remember."
  >

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      font-family: "Rubik", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    header {
      display: none;
    }

    /* =========================
       SPLIT LAYOUT
       ========================= */

    .split {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .split-poster,
    .split-content {
      width: 50%;
      min-height: 100vh;
    }

    .split-poster {
      background-image: url('poster.jpg');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #000000;
    }

    .split-content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 4vw, 48px);
    }

    /* Stack vertically on narrower screens */
    @media (max-width: 800px) {
      .split {
        flex-direction: column;
      }
      .split-poster,
      .split-content {
        width: 100%;
        min-height: auto;
      }
      .split-poster {
        aspect-ratio: 27 / 40;
      }
      .split-content {
        padding: clamp(24px, 6vw, 40px);
      }
    }

    /* =========================
       HERO CONTENT
       ========================= */

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      max-width: 420px;
    }

    .hero h1 {
      margin: 0;
      font-family: "Rubik", Arial, sans-serif;
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.03em;
      color: #ffffff;
      animation: fadeUp 0.8s ease both;
    }

    /* Vertical nav list */
    .hero nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      animation: fadeUp 0.8s ease both 0.25s;
    }

    .hero nav a {
      color: #ffffff;
      font-size: 25px;
      letter-spacing: 0.08em;
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .hero nav a:hover {
      color: #cccccc;
      border-bottom-color: #ffffff;
    }

    /* =========================
       FOOTER
       ========================= */

    footer {
      position: absolute;
      bottom: 0;
      width: 50%;
      right: 0;
      padding: 24px;
      color: #ffffff;
      font-family: "Rubik", Arial, sans-serif;
      text-align: center;
      opacity: 0.7;
      font-size: .85rem;
    }

    @media (max-width: 800px) {
      footer {
        position: static;
        width: 100%;
      }
    }

    /* =========================
       ANIMATION
       ========================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>

</head>


<body>

  <div class="split">

    <div class="split-poster" role="img" aria-label="A Power Within: Ukrainian POWs Remember movie poster"></div>

    <div class="split-content">
      <section class="hero">

        <nav>
          <a href="about.html">ABOUT</a>
          <a href="team.html">TEAM</a>
          <a href="work.html">WORK</a>
          <a href="screenings.html">SCREENINGS</a>
          <a href="press.html">PRESS</a>
          <a href="contact.html">CONTACT</a>
        </nav>

      </section>
    </div>

  </div>

  <footer>
    &copy; <span id="year"></span> Andrea Odezynska. All Rights Reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
